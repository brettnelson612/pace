# ---------------------------------------------------------------------------
# pixi.toml — PACE's dependency, environment, and task manager, powered by
# Pixi (https://pixi.sh). Pixi resolves and locks dependencies (conda +
# PyPI) into reproducible, named environments, and provides a task runner
# (`pixi run <task>`) for common workflows — all from this one file.
#
# This is the single source of truth for dependencies across PACE's whole
# monorepo (Python, C++, Rust) — there is no separate requirements.txt,
# Cargo-managed toolchain, etc. Dependencies are grouped into reusable
# "features" (e.g. [feature.openmc]), which are inert on their own; actual
# installable, named [environments] compose a set of features together
# (e.g. no-phys-dev = dev-tools + pace-py). An environment's supported
# platforms are the *intersection* of its features' platforms, not the
# union — this is why environments that include openmc or moose lose
# osx-arm64 even though pace-py itself supports it.
#
# Every environment runs the same Python (pinned in pace-py) and the same
# black/ruff (pinned in dev-tools), so lint, format and test results don't
# depend on which environment you use.
#
# Quick start:
#   pixi install -e <environment>     # build/rebuild an environment
#   pixi shell -e <environment>       # drop into an activated shell
#   pixi run -e <environment> <task>  # run a task without shelling in
#   pixi run check                    # everything CI runs, before pushing
#
# Which environment: no-phys-dev for everyday modeling/registry/service
# work, full-phys-dev for MOOSE/Cardinal work. See [environments] at the bottom
# of this file.
# ---------------------------------------------------------------------------

[workspace]
authors = [
    "Brett Nelson <brettleenelson@gmail.com>",
    "Paul Varkey <paul.varkey@gmail.com>",
]
channels = ["conda-forge"]
name = "pace"
platforms = ["osx-arm64", "osx-64", "linux-64", { name = "osx-64-moose", platform = "osx-64", macos = "13.3" }]
version = "0.1.0"

# ---------------------------------------------------------------------------
# Composite dev-workflow tasks.
#
# Tasks:
# - ruff: lint only, no autofix.
# - ruff-fix: lint, autofixing what's safely fixable.
# - black-check: formatting check only — fails if black would reformat
#       anything, doesn't rewrite files. What CI runs.
# - black-fix: actually reformats files in place.
# - typecheck: static type checking.
# - test-unit: unit test suite only (python/tests/unit/), with coverage,
#       including which specific lines are missed. Fast — the everyday
#       local loop.
# - test-integration: integration test suite only
#       (python/tests/integration/) — real DB/IO wiring, not isolated
#       units. Slower than test-unit; not part of the fast local loop,
#       but still part of `check`/CI.
# - check: everything CI runs, in the same order. Run this before pushing.
# - format: fast local autofix pass (lint-fix, then format — order
#       matters, black gets final say over formatting). Does not run
#       typecheck/test-unit/test-integration.
#
# Without -e, tasks run in the `default` environment, which has the same
# features as no-phys-dev — the environment CI uses.
#
# Common workflow:
#   pixi run format
#   pixi run check
#
# ---------------------------------------------------------------------------

[tasks]
ruff = "ruff check ."
ruff-fix = "ruff check --fix ."
black-check = "black --check ."
black-fix = "black ."
typecheck = "mypy python/src/pace"
test-unit = "pytest python/tests/unit/ --cov=pace --cov-report=term-missing"
test-integration = "pytest python/tests/integration/"
check = { depends-on = ["ruff", "black-check", "typecheck", "test-unit", "test-integration"] }
format = { depends-on = ["ruff-fix", "black-fix"] }


# ---------------------------------------------------------------------------
# "dev-tools" feature — lint, format, type checking, testing.
#
# black and ruff are exact-pinned to the versions moose-tools requires
# (black 26.5.1.*, ruff 0.15.15.*). Every environment includes this
# feature, so every environment — with or without MOOSE — resolves the
# same linter and formatter. Bump them only together with moose-dev.
# ---------------------------------------------------------------------------

[feature.dev-tools.dependencies]
black = "==26.5.1"
ruff = "==0.15.15"
mypy = ">=2.3.1,<3"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"

# ---------------------------------------------------------------------------
# "pace-py" feature — PACE's Python setup.
#
# Python is pinned to one minor version for the whole project: MOOSE's
# dependencies require 3.12, and pinning it here (every environment
# includes pace-py) keeps no-phys-dev and py-phys-dev on the same
# interpreter as full-phys-dev, so CI tests what every environment runs.
# Keep `requires-python` in python/pyproject.toml in sync with this pin.
# ---------------------------------------------------------------------------

[feature.pace-py.dependencies]
python = "3.12.*"
fastapi = "*"
sqlalchemy = ">=2.0.52,<3"

[feature.pace-py.pypi-dependencies]
pace = { path = "python", editable = true }

# ---------------------------------------------------------------------------
# "openmc" feature — OpenMC (https://openmc.org/)
#
# conda-forge has no osx-arm64 build of OpenMC, so any environment that
# includes it is limited to osx-64 (Rosetta emulation on Apple Silicon)
# and linux-64.
# ---------------------------------------------------------------------------

[feature.openmc]
platforms = ["osx-64", "linux-64"]

[feature.openmc.dependencies]
openmc = "*"

# ---------------------------------------------------------------------------
# "moose" feature — MOOSE (https://mooseframework.inl.gov/)
#
# Known gotchas (don't re-derive):
#    - moose-dev's version and the .moose/ git checkout must stay in lockstep —
#          a mismatch produces real libMesh API compile errors, not a warning.
#          moose-dev prints the exact version it wants on mismatch; match it here.
#    - moose-libmesh-vtk isn't bundled into moose-dev — it's a separate
#          dependency. Leave it at "*" and let the solver pick it — moose-dev
#          pins its exact required VTK version transitively; pinning VTK
#          yourself is what breaks the link step.
#    - macOS needs >=13.3 for moose-libmesh (see the osx-64-moose platform
#          variant in [workspace] — that's why it exists).
#    - Build/test targets live in .moose/test, not .moose/ itself — MOOSE's
#          repo root has no top-level Makefile.
#    - moose-dev also determines the Python version (3.12) and the black/ruff
#          pins in dev-tools — a moose-dev bump may require bumping those too.
#
# Tasks:
#    - moose-clone: clone idaholab/moose (master) into .moose/, if not already
#          present. No-op if .moose/framework already exists.
#    - moose-clean: remove git-ignored build artifacts from .moose/ (source is
#          untouched). Reach for this manually when you suspect a stale build
#          cache — e.g. after bumping moose-dev's version.
#    - moose-build: incremental build of the MOOSE framework test binary. Fast
#          on repeat runs; can miss issues a stale build cache masks.
#    - moose-verify: run MOOSE's own test harness against the current build —
#          the real proof the toolchain (compilers, moose-dev's PETSc/libMesh)
#          works end to end.
#    - moose-fresh-build: same as moose-build, but wipes build artifacts
#          first. Slower — use when you don't trust the existing build cache.
#    - moose-fresh-build-and-verify: fresh build + verify in one call. The
#          safest option when the environment itself changed (moose-dev/VTK
#          version bump) — incremental build/verify can silently pass against
#          stale artifacts otherwise.
#
# First-time fresh build:
#   pixi run -e full-phys-dev moose-fresh-build-and-verify
#
# ---------------------------------------------------------------------------

[feature.moose]
channels = [{ channel = "https://conda.software.inl.gov/public", priority = 1 }]
platforms = ["osx-64-moose", "linux-64"]

[feature.moose.dependencies]
moose-dev = "2026.8.23.*"
moose-libmesh-vtk = "*"

[feature.moose.tasks]
moose-clone = { cmd = "test -d .moose/framework || git clone --branch master https://github.com/idaholab/moose.git .moose" }
moose-clean = { cmd = "git clean -Xfd && git submodule foreach --recursive git clean -Xfd", cwd = ".moose", depends-on = ["moose-clone"] }
moose-build = { cmd = "make -j $(nproc 2>/dev/null || sysctl -n hw.ncpu)", cwd = ".moose/test", depends-on = ["moose-clone"] }
moose-verify = { cmd = "./run_tests -j 2", cwd = ".moose/test", depends-on = ["moose-build"] }
moose-fresh-build = { cmd = "make -j $(nproc 2>/dev/null || sysctl -n hw.ncpu)", cwd = ".moose/test", depends-on = ["moose-clean"] }
moose-fresh-build-and-verify = { cmd = "./run_tests -j 4", cwd = ".moose/test", depends-on = ["moose-fresh-build"] }

# ---------------------------------------------------------------------------
# "cpp-build" feature — PACE's C++ setup
# ---------------------------------------------------------------------------

[feature.cpp-build.dependencies]
cmake = "*"
compilers = "*"

# ---------------------------------------------------------------------------
# "rust-build" feature — PACE's Rust setup
# ---------------------------------------------------------------------------

[feature.rust-build.dependencies]
rust = "*"

# ---------------------------------------------------------------------------
# Environments. dev-tools and pace-py are in every environment, so all of
# them share one Python version and one black/ruff toolchain.
#
# Environments:
#    - default: what a bare `pixi run <task>` (no -e) uses. Same features as
#          no-phys-dev, so `pixi run check` runs exactly what CI runs.
#    - no-phys-dev: modeling, registry and service work — no OpenMC, no
#          MOOSE. The only environment that runs natively on Apple Silicon
#          (osx-arm64), as well as osx-64/linux-64. What CI runs.
#    - py-phys-dev: OpenMC-dependent work in python/ — no C++/Rust build
#          tooling, no MOOSE. osx-64 (emulated on Apple Silicon) / linux-64.
#    - full-phys-dev: everything — OpenMC + MOOSE + C++/Rust build tooling —
#          the Cardinal build target. osx-64 (emulated) / linux-64. The only
#          environment with the moose-* tasks.
#
# Shelling into an env:
#   pixi shell -e <environment>
#
# Exiting an env:
#   exit
#
# ---------------------------------------------------------------------------

[environments]
default = ["dev-tools", "pace-py"]
no-phys-dev = ["dev-tools", "pace-py"]
full-phys-dev = ["dev-tools", "pace-py", "openmc", "cpp-build", "rust-build", "moose"]
