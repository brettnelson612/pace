[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pace"
version = "0.1.0"
description = "PACE (Physics-Aware Coupled Emulator) platform"
requires-python = ">=3.12,<3.13"
# don't put dependencies here, put them in root pixi.toml instead

[tool.setuptools.packages.find]
where = ["src"]
include = ["pace*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # ruff defaults: syntax errors, undefined names, unused imports
    "I",    # import sorting
    "B",    # flake8-bugbear: likely bugs
    "UP",   # pyupgrade: modern syntax for the target Python
    "N",    # pep8-naming
    "SIM",  # simplifications
    "C4",   # comprehension cleanups
    "PT",   # pytest style
    "RUF",  # ruff's own rules
]

[tool.ruff.lint.isort]
known-first-party = ["pace"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["sqlalchemy.orm.declared_attr"]

[tool.ruff.lint.per-file-ignores]
# ignore PT012 to allow us to more easily write tests with rolled back
# failed transactions against SQLAlchemy db
"tests/integration/**" = ["PT012"]
"tests/**" = ["PT011"]
